<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Finance</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f5;
      color: #18181b;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e5e5;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header span {
      color: #16a34a;
    }

    .status {
      font-size: 13px;
      color: #71717a;
    }

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border: 1px solid #e4e4e7;
      border-radius: 10px;
      padding: 22px;
    }

    .card p {
      margin: 0 0 8px;
      color: #71717a;
      font-size: 13px;
    }

    .card h2 {
      margin: 0;
      font-size: 25px;
    }

    .income {
      color: #16a34a;
    }

    .expense {
      color: #dc2626;
    }

    .toolbar {
      background: white;
      border: 1px solid #e4e4e7;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-radius: 10px 10px 0 0;
    }

    .tabs {
      display: flex;
      gap: 5px;
    }

    .tabs button {
      border: none;
      background: transparent;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .tabs button.active {
      background: #18181b;
      color: white;
    }

    button {
      cursor: pointer;
    }

    .add-btn {
      background: #18181b;
      color: white;
      border: none;
      border-radius: 7px;
      padding: 10px 15px;
    }

    .table-container {
      background: white;
      border: 1px solid #e4e4e7;
      border-top: none;
      border-radius: 0 0 10px 10px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th {
      background: #fafafa;
      color: #71717a;
      font-size: 12px;
      text-align: left;
      padding: 13px 18px;
    }

    td {
      padding: 15px 18px;
      border-top: 1px solid #f0f0f0;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #f4f4f5;
      font-size: 12px;
      color: #52525b;
    }

    .actions button {
      padding: 6px 9px;
      border-radius: 5px;
      border: 1px solid #ddd;
      background: white;
      margin-right: 4px;
    }

    .actions .delete {
      color: #dc2626;
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: #71717a;
    }

    /* Modal */

    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 450px;
      padding: 25px;
      border-radius: 12px;
    }

    .modal h2 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d4d4d8;
      border-radius: 6px;
      font-size: 14px;
    }

    .field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .cancel {
      background: white;
      border: 1px solid #ddd;
      padding: 10px 15px;
      border-radius: 6px;
    }

    .save {
      background: #18181b;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 20px;
      display: none;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: 1fr;
      }

      header {
        padding: 15px;
      }

      .container {
        margin-top: 20px;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>My<span>Finance</span></h1>
  <div class="status" id="connectionStatus">
    Connecting...
  </div>
</header>

<div class="container">

  <div id="errorBox" class="error"></div>

  <div class="cards">

    <div class="card">
      <p>Balance</p>
      <h2 id="balance">Rs 0.00</h2>
    </div>

    <div class="card">
      <p>Total Income</p>
      <h2 class="income" id="totalIncome">Rs 0.00</h2>
    </div>

    <div class="card">
      <p>Total Expenses</p>
      <h2 class="expense" id="totalExpenses">Rs 0.00</h2>
    </div>

  </div>

  <div class="toolbar">

    <div class="tabs">
      <button id="expensesTab"
              class="active"
              onclick="showTransactions('expenses')">
        Expenses
      </button>

      <button id="incomeTab"
              onclick="showTransactions('income')">
        Income
      </button>
    </div>

    <button class="add-btn" onclick="openAddModal()">
      + Add
    </button>

  </div>

  <div class="table-container">

    <table>

      <thead>
        <tr>
          <th>Title</th>
          <th>Category</th>
          <th>Date</th>
          <th>Amount</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="tableBody">
      </tbody>

    </table>

  </div>

</div>

<!-- MODAL -->

<div id="modal" class="modal-bg">

  <div class="modal">

    <h2 id="modalTitle">Add Expense</h2>

    <form id="transactionForm">

      <input type="hidden" id="editId">

      <div class="field">
        <label>Title</label>
        <input
          id="title"
          type="text"
          placeholder="e.g. Groceries"
          required
        >
      </div>

      <div class="field">
        <label>Amount</label>
        <input
          id="amount"
          type="number"
          min="0"
          step="0.01"
          placeholder="0.00"
          required
        >
      </div>

      <div class="field">
        <label>Category</label>

        <select id="category" required>
        </select>

      </div>

      <div class="field">
        <label>Date</label>

        <input
          id="date"
          type="date"
          required
        >

      </div>

      <div class="field">
        <label>Description</label>

        <textarea
          id="description"
          placeholder="Optional"
        ></textarea>

      </div>

      <div class="modal-buttons">

        <button
          type="button"
          class="cancel"
          onclick="closeModal()">
          Cancel
        </button>

        <button
          type="submit"
          class="save">
          Save
        </button>

      </div>

    </form>

  </div>

</div>


<script>

  /*
   ==================================================
   FASTAPI CONFIGURATION
   ==================================================
  */

  const API_URL = import.meta.env.VITE_API_URL;



  /*
   ==================================================
   APPLICATION STATE
   ==================================================
  */

  let expenses = [];
  let incomes = [];

  let currentType = "expenses";


  /*
   ==================================================
   API REQUEST FUNCTION
   ==================================================
  */

  async function request(endpoint, options = {}) {

    console.log("API REQUEST:", API_URL + endpoint);

    const response = await fetch(API_URL + endpoint, {
      ...options,

      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json",
        ...(options.headers || {})
      }
    });

    console.log(
      "API RESPONSE:",
      response.status,
      response.statusText
    );

    if (!response.ok) {

      let message = `API Error ${response.status}`;

      try {

        const data = await response.json();

        if (data.detail) {

          if (Array.isArray(data.detail)) {
            message = data.detail
              .map(error => error.msg)
              .join(", ");
          } else {
            message = data.detail;
          }

        }

      } catch (_) {}

      throw new Error(message);
    }

    if (response.status === 204) {
      return null;
    }

    return response.json();
  }


  /*
   ==================================================
   CHECK API CONNECTION
   ==================================================
  */

  async function checkConnection() {

    const status =
      document.getElementById("connectionStatus");

    try {

      await request("/");

      status.textContent = "● API Connected";
      status.style.color = "#16a34a";

    } catch (error) {

      status.textContent = "● API Offline";
      status.style.color = "#dc2626";

      showError(
        "Cannot connect to FastAPI. Make sure your server is running at " +
        API_URL
      );

      console.error(error);
    }
  }


  /*
   ==================================================
   LOAD EVERYTHING
   ==================================================
  */

  async function loadData() {

    hideError();

    try {

      const results = await Promise.all([
        request("/expenses"),
        request("/income")
      ]);

      expenses = results[0] || [];
      incomes = results[1] || [];

      updateDashboard();
      renderTable();

      document.getElementById("connectionStatus").textContent =
        "● API Connected";

      document.getElementById("connectionStatus").style.color =
        "#16a34a";

    } catch (error) {

      console.error(error);

      showError(
        "Failed to load data from FastAPI: " +
        error.message
      );

    }
  }


  /*
   ==================================================
   DASHBOARD
   ==================================================
  */

  function updateDashboard() {

    const totalIncome = incomes.reduce(
      (total, item) =>
        total + parseFloat(item.amount || 0),
      0
    );

    const totalExpenses = expenses.reduce(
      (total, item) =>
        total + parseFloat(item.amount || 0),
      0
    );

    const balance =
      totalIncome - totalExpenses;

    document.getElementById("totalIncome")
      .textContent = money(totalIncome);

    document.getElementById("totalExpenses")
      .textContent = money(totalExpenses);

    document.getElementById("balance")
      .textContent = money(balance);
  }


  /*
   ==================================================
   RENDER TABLE
   ==================================================
  */

  function renderTable() {

    const tbody =
      document.getElementById("tableBody");

    const data =
      currentType === "expenses"
        ? expenses
        : incomes;

    if (!data.length) {

      tbody.innerHTML = `
        <tr>
          <td colspan="5">
            <div class="empty">
              No ${currentType} found.
            </div>
          </td>
        </tr>
      `;

      return;
    }

    tbody.innerHTML = data.map(item => {

      const date =
        currentType === "expenses"
          ? item.expense_date
          : item.income_date;

      return `
        <tr>

          <td>
            <strong>
              ${escapeHTML(item.title)}
            </strong>

            <div style="color:#71717a;font-size:12px;margin-top:3px">
              ${escapeHTML(item.description || "")}
            </div>
          </td>

          <td>
            <span class="badge">
              ${escapeHTML(item.category)}
            </span>
          </td>

          <td>
            ${formatDate(date)}
          </td>

          <td class="${
            currentType === "income"
              ? "income"
              : "expense"
          }">

            ${
              currentType === "income"
                ? "+"
                : "-"
            }

            ${money(item.amount)}

          </td>

          <td>

            <div class="actions">

              <button
                onclick="editTransaction(${item.id})">
                Edit
              </button>

              <button
                class="delete"
                onclick="deleteTransaction(${item.id})">
                Delete
              </button>

            </div>

          </td>

        </tr>
      `;

    }).join("");
  }


  /*
   ==================================================
   SWITCH BETWEEN EXPENSE / INCOME
   ==================================================
  */

  function showTransactions(type) {

    currentType = type;

    document
      .getElementById("expensesTab")
      .classList.toggle(
        "active",
        type === "expenses"
      );

    document
      .getElementById("incomeTab")
      .classList.toggle(
        "active",
        type === "income"
      );

    renderTable();
  }


  /*
   ==================================================
   MODAL
   ==================================================
  */

  function openAddModal() {

    document.getElementById("transactionForm").reset();

    document.getElementById("editId").value = "";

    document.getElementById("modalTitle").textContent =
      currentType === "expenses"
        ? "Add Expense"
        : "Add Income";

    setupCategories();

    document.getElementById("date").value =
      new Date().toISOString().split("T")[0];

    document
      .getElementById("modal")
      .classList.add("show");
  }


  function closeModal() {

    document
      .getElementById("modal")
      .classList.remove("show");
  }


  /*
   ==================================================
   CATEGORIES
   ==================================================
  */

  function setupCategories() {

    const select =
      document.getElementById("category");

    const categories =
      currentType === "expenses"
        ? [
            "food",
            "rent",
            "transport",
            "shopping",
            "bills",
            "health",
            "education",
            "entertainment",
            "other"
          ]
        : [
            "salary",
            "freelance",
            "business",
            "investment",
            "bonus",
            "other"
          ];

    select.innerHTML =
      categories.map(category =>
        `<option value="${category}">
          ${capitalize(category)}
        </option>`
      ).join("");
  }


  /*
   ==================================================
   CREATE / UPDATE
   ==================================================
  */

  document
    .getElementById("transactionForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const id =
        document.getElementById("editId").value;

      const title =
        document.getElementById("title").value;

      const amount =
        parseFloat(
          document.getElementById("amount").value
        );

      const category =
        document.getElementById("category").value;

      const date =
        document.getElementById("date").value;

      const description =
        document.getElementById("description").value;


      let data = {
        title,
        amount,
        category,
        description
      };


      if (currentType === "expenses") {

        data.expense_date = date;

      } else {

        data.income_date = date;

      }


      try {

        const endpoint =
          currentType === "expenses"
            ? "/expenses"
            : "/income";


        if (id) {

          await request(
            endpoint + "/" + id,
            {
              method: "PUT",
              body: JSON.stringify(data)
            }
          );

        } else {

          await request(
            endpoint,
            {
              method: "POST",
              body: JSON.stringify(data)
            }
          );

        }


        closeModal();

        await loadData();

      } catch (error) {

        console.error(error);

        showError(
          "Could not save transaction: " +
          error.message
        );

      }

    });


  /*
   ==================================================
   EDIT
   ==================================================
  */

  function editTransaction(id) {

    const list =
      currentType === "expenses"
        ? expenses
        : incomes;

    const item =
      list.find(x => x.id === id);

    if (!item) return;

    setupCategories();

    document.getElementById("editId").value =
      item.id;

    document.getElementById("title").value =
      item.title;

    document.getElementById("amount").value =
      parseFloat(item.amount);

    document.getElementById("category").value =
      item.category;

    document.getElementById("description").value =
      item.description || "";

    document.getElementById("date").value =
      currentType === "expenses"
        ? item.expense_date
        : item.income_date;

    document.getElementById("modalTitle").textContent =
      currentType === "expenses"
        ? "Edit Expense"
        : "Edit Income";

    document
      .getElementById("modal")
      .classList.add("show");
  }


  /*
   ==================================================
   DELETE
   ==================================================
  */

  async function deleteTransaction(id) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this transaction?"
      );

    if (!confirmed) return;

    try {

      const endpoint =
        currentType === "expenses"
          ? "/expenses/"
          : "/income/";

      await request(
        endpoint + id,
        {
          method: "DELETE"
        }
      );

      await loadData();

    } catch (error) {

      console.error(error);

      showError(
        "Could not delete transaction: " +
        error.message
      );

    }
  }


  /*
   ==================================================
   HELPERS
   ==================================================
  */

  function money(value) {

    return "Rs " +
      parseFloat(value || 0)
        .toLocaleString("en-IN", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
  }


  function formatDate(date) {

    if (!date) return "";

    return new Date(date + "T00:00:00")
      .toLocaleDateString("en-US", {
        month: "short",
        day: "numeric",
        year: "numeric"
      });
  }


  function capitalize(value) {

    return value.charAt(0).toUpperCase() +
      value.slice(1);
  }


  function escapeHTML(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function showError(message) {

    const box =
      document.getElementById("errorBox");

    box.textContent = message;
    box.style.display = "block";
  }


  function hideError() {

    document.getElementById("errorBox")
      .style.display = "none";
  }


  /*
   ==================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
   ==================================================
  */

  document
    .getElementById("modal")
    .addEventListener("click", function(event) {

      if (event.target === this) {
        closeModal();
      }

    });


  /*
   ==================================================
   START APPLICATION
   ==================================================
  */

  checkConnection();
  loadData();

</script>

</body>
</html>
